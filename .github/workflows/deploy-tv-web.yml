name: Deploy UltimateJarvis TV Web

on:
  push:
    branches:
      - main
    paths:
      - "tv-web/**"
      - ".github/workflows/deploy-tv-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-tv-web"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload TV web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: tv-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
