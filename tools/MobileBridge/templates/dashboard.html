<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S · Mobile Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-0: #030711;
            --bg-1: #0a0f24;
            --bg-2: #111a35;
            --surface: rgba(15, 23, 42, 0.55);
            --surface-2: rgba(30, 41, 59, 0.65);
            --border: rgba(148, 163, 184, 0.14);
            --border-hover: rgba(56, 189, 248, 0.45);
            --accent: #38bdf8;
            --accent-2: #22d3ee;
            --accent-3: #a855f7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --muted-2: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-0);
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            will-change: transform;
        }

        .orb-1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, #0ea5e9, transparent 65%);
            top: -180px; left: -140px;
            animation: float1 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 620px; height: 620px;
            background: radial-gradient(circle, #a855f7, transparent 65%);
            bottom: -220px; right: -180px;
            animation: float2 24s ease-in-out infinite;
        }

        .orb-3 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, #06b6d4, transparent 65%);
            top: 40%; left: 45%;
            animation: float3 28s ease-in-out infinite;
            opacity: 0.32;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(80px, 60px) scale(1.1); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-90px, -70px) scale(1.15); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(-60px, 40px) scale(1.08); }
            66%      { transform: translate(70px, -50px) scale(0.95); }
        }

        .shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1080px;
            background: linear-gradient(160deg, rgba(15,23,42,0.72), rgba(2,6,23,0.82));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(56, 189, 248, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 34px;
            animation: shellIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes shellIn {
            from { opacity: 0; transform: translateY(28px) scale(0.985); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 22px;
            color: #e0f2fe;
            background: linear-gradient(135deg, #0ea5e9, #6366f1, #a855f7);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.55), inset 0 1px 0 rgba(255,255,255,0.3);
            animation: logoPulse 3.6s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.55), inset 0 1px 0 rgba(255,255,255,0.3); }
            50%      { box-shadow: 0 0 50px rgba(168, 85, 247, 0.75), inset 0 1px 0 rgba(255,255,255,0.35); }
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #f0f9ff;
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.65);
        }

        .brand p {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .live-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--success);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .live-pill .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 0 rgba(16,185,129,0.8);
            animation: pulseLive 1.8s infinite;
        }

        @keyframes pulseLive {
            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.8); }
            70%  { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .stat:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.12);
        }

        .stat i {
            font-size: 18px;
            color: var(--accent);
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .stat > div {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat span {
            font-size: 20px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        .stat small {
            font-size: 10.5px;
            color: var(--muted);
            letter-spacing: 1.4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 20px;
        }

        @media (max-width: 820px) {
            .grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
            .hero { flex-direction: column; align-items: flex-start; }
            .shell { padding: 24px; }
        }

        .card {
            position: relative;
            border-radius: 18px;
            padding: 22px;
            background: linear-gradient(160deg, rgba(30,41,59,0.55), rgba(2,6,23,0.7));
            border: 1px solid var(--border);
            overflow: hidden;
            transition: border-color 0.35s;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 1px;
            background: linear-gradient(135deg, transparent 40%, rgba(56,189,248,0.45) 50%, transparent 60%);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .card:hover::after {
            opacity: 1;
            animation: borderShift 3s linear infinite;
        }

        @keyframes borderShift {
            0%   { background-position: 0% 0%; }
            100% { background-position: 300% 300%; }
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .card-head i {
            color: var(--accent);
            font-size: 13px;
        }

        .card-head .badge {
            margin-left: auto;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .qr-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .qr-frame {
            position: relative;
            padding: 12px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.35), inset 0 0 0 1px rgba(56, 189, 248, 0.1);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s;
            overflow: hidden;
        }

        .qr-frame:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.6), inset 0 0 0 1px rgba(56, 189, 248, 0.2);
        }

        .qr-frame img {
            display: block;
            width: 200px;
            height: 200px;
            border-radius: 8px;
        }

        .scanline {
            position: absolute;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #a855f7, #38bdf8, transparent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.9);
            animation: scan 3s ease-in-out infinite;
            pointer-events: none;
            border-radius: 3px;
        }

        @keyframes scan {
            0%   { top: 8%; opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: 92%; opacity: 0; }
        }

        .cmd {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .cmd i {
            color: var(--accent);
            font-size: 13px;
            flex-shrink: 0;
        }

        .cmd .cmd-text {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 11px;
            color: var(--success);
            word-break: break-all;
            transition: color 0.25s;
            text-align: left;
            flex: 1;
        }

        .cmd:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 22px rgba(16, 185, 129, 0.18);
        }

        .cmd.copied {
            border-color: var(--accent);
            box-shadow: 0 0 26px rgba(56, 189, 248, 0.5);
        }

        .cmd.copied .cmd-text { color: var(--accent); }

        .tip {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .tip i { color: var(--warning); font-size: 11px; }

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .device-list::-webkit-scrollbar { width: 6px; }
        .device-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
            transition: background 0.2s;
        }
        .device-list::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

        .empty {
            text-align: center;
            padding: 46px 20px;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty i {
            font-size: 28px;
            color: var(--muted-2);
            animation: softFloat 3s ease-in-out infinite;
        }

        @keyframes softFloat {
            0%, 100% { transform: translateY(0); opacity: 0.7; }
            50%      { transform: translateY(-6px); opacity: 1; }
        }

        .empty p {
            font-size: 12.5px;
            letter-spacing: 0.6px;
        }

        .device {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: linear-gradient(145deg, rgba(30,41,59,0.85), rgba(15,23,42,0.9));
            border: 1px solid var(--border);
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .device::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--success), var(--accent));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .device:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateX(4px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.12);
        }

        .device:hover::before { opacity: 1; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-28px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .device.removing {
            animation: slideOut 0.32s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(60px) scale(0.95); }
        }

        .device-icon {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            font-size: 16px;
            color: #e0f2fe;
            background: linear-gradient(135deg, rgba(56,189,248,0.22), rgba(168,85,247,0.22));
            border: 1px solid rgba(56, 189, 248, 0.28);
            flex-shrink: 0;
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .device-name {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status {
            font-size: 10.5px;
            color: var(--muted);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .device-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        .battery {
            position: relative;
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .battery svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .battery .ring-bg {
            fill: none;
            stroke: rgba(148, 163, 184, 0.14);
            stroke-width: 3.5;
        }

        .battery .ring-fill {
            fill: none;
            stroke: var(--success);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 113.1;
            stroke-dashoffset: 113.1;
            transition: stroke-dashoffset 0.9s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s;
        }

        .battery.low .ring-fill { stroke: var(--danger); }
        .battery.mid .ring-fill { stroke: var(--warning); }
        .battery.high .ring-fill { stroke: var(--success); }

        .battery-label {
            position: relative;
            font-size: 12.5px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 0.3px;
            display: flex;
            align-items: baseline;
            gap: 1px;
        }

        .battery-label span {
            font-size: 8px;
            color: var(--muted);
            font-weight: 700;
        }

        .battery-bolt {
            position: absolute;
            top: -2px;
            right: -4px;
            font-size: 9px;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.9);
            animation: boltFlash 1.6s ease-in-out infinite;
            display: none;
        }

        .battery.charging .battery-bolt { display: block; }

        @keyframes boltFlash {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.55; transform: scale(0.9); }
        }

        .battery.unavailable .ring-fill { stroke: var(--muted-2); stroke-dashoffset: 113.1; }
        .battery.unavailable .battery-label { color: var(--muted); font-size: 10px; }

        .btn-revoke {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 13px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .btn-revoke:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            box-shadow: 0 0 22px rgba(239, 68, 68, 0.6);
            transform: scale(1.08);
        }

        .btn-revoke:disabled {
            opacity: 0.4;
            cursor: wait;
            transform: none;
        }

        .device {
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }

        .device-top {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .device.dragover {
            border-color: var(--accent);
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.35);
            background: rgba(14, 165, 233, 0.12);
        }

        .meta-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .meta-pill {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .device-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.65);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action i {
            color: var(--accent);
            font-size: 11px;
        }

        .btn-action:hover {
            border-color: var(--border-hover);
            background: rgba(56, 189, 248, 0.14);
            transform: translateY(-1px);
        }

        .btn-action:disabled {
            opacity: 0.45;
            cursor: wait;
            transform: none;
        }

        .drop-hint {
            font-size: 10px;
            color: var(--muted-2);
            letter-spacing: 0.5px;
        }

        .transfer-banner {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.35);
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .transfer-banner.active {
            display: flex;
        }

        .transfer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text);
        }

        .transfer-bar-bg {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.18);
            overflow: hidden;
        }

        .transfer-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--success));
            transition: width 0.2s ease;
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid var(--border-hover);
            color: #f8fafc;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="shell">
        <header class="hero">
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-circle-nodes"></i></div>
                <div>
                    <h1>J.A.R.V.I.S</h1>
                    <p>Mobile Command Bridge</p>
                </div>
            </div>
            <div class="live-pill">
                <span class="pulse"></span>
                <span id="bridge-pill-text">Listening</span>
            </div>
        </header>

        <section class="stats">
            <div class="stat">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <div>
                    <span id="stat-devices">0</span>
                    <small>Paired Devices</small>
                </div>
            </div>
            <div class="stat">
                <i class="fa-solid fa-battery-three-quarters"></i>
                <div>
                    <span id="stat-battery">--</span>
                    <small>Avg Battery</small>
                </div>
            </div>
            <div class="stat">
                <i class="fa-solid fa-network-wired"></i>
                <div>
                    <span id="stat-status">Online</span>
                    <small>Bridge Status</small>
                </div>
            </div>
        </section>

        <section class="grid">
            <article class="card qr-card">
                <div class="card-head">
                    <i class="fa-solid fa-qrcode"></i>
                    <span>Scan to Pair</span>
                </div>
                <div class="qr-body">
                    <div class="qr-frame">
                        <img id="qr-img" src="/api/qr" alt="QR Code">
                        <div class="scanline"></div>
                    </div>
                    <div class="cmd" id="cmd-box" onclick="copyCmd(this)">
                        <i class="fa-regular fa-copy"></i>
                        <span class="cmd-text">curl -s http://{{ip_address}}:{{port}}/api/setup | python</span>
                    </div>
                    <p class="tip">
                        <i class="fa-solid fa-lightbulb"></i>
                        Termux &middot; Share any file on Android &rarr; Termux to send to PC
                    </p>
                </div>
            </article>

            <article class="card devices-card">
                <div class="card-head">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <span>Connected Devices</span>
                    <span class="badge" id="dev-count">0</span>
                </div>
                <div class="device-list" id="device-list">
                    <div class="empty" id="empty-msg">
                        <i class="fa-solid fa-inbox"></i>
                        <p>No devices paired yet</p>
                    </div>
                </div>
                <div class="transfer-banner" id="transfer-banner">
                    <div class="transfer-head">
                        <span id="transfer-title">Transferring file...</span>
                        <span id="transfer-pct">0%</span>
                    </div>
                    <div class="transfer-bar-bg">
                        <div class="transfer-bar-fill" id="transfer-fill"></div>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <input type="file" id="hidden-file-input" multiple style="display:none">
    <div class="toast-msg" id="toast-msg"></div>

    <script>
        const port = "{{port}}";
        const devices = new Map();
        const CIRC = 113.1;
        let currentUploadTarget = null;

        function showToast(text) {
            const t = document.getElementById('toast-msg');
            t.innerText = text;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3200);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function batteryClass(level) {
            if (level == null || level < 0) return 'unavailable';
            if (level < 20) return 'low';
            if (level < 60) return 'mid';
            return 'high';
        }

        function batteryHTML(b) {
            const hasLevel = b && typeof b.level === 'number' && b.level >= 0;
            const level = hasLevel ? b.level : null;
            const charging = b && b.charging;
            const cls = batteryClass(level);
            const offset = hasLevel ? (CIRC * (1 - level / 100)) : CIRC;
            const label = hasLevel ? `${level}<span>%</span>` : 'N/A';
            return `
                <div class="battery ${cls} ${charging ? 'charging' : ''}">
                    <svg viewBox="0 0 44 44">
                        <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
                        <circle class="ring-fill" cx="22" cy="22" r="18" style="stroke-dashoffset:${offset}"></circle>
                    </svg>
                    <div class="battery-label">${label}</div>
                    <i class="fa-solid fa-bolt battery-bolt"></i>
                </div>
            `;
        }

        function metaPillsHTML(storage, network, battery) {
            const pills = [];
            if (storage && storage.free_gb != null) {
                pills.push(`<span class="meta-pill"><i class="fa-solid fa-hard-drive"></i> ${storage.free_gb} GB free</span>`);
            }
            if (network && network.ip) {
                pills.push(`<span class="meta-pill"><i class="fa-solid fa-wifi"></i> ${escapeHtml(network.ip)}</span>`);
            }
            if (battery && battery.temperature != null) {
                pills.push(`<span class="meta-pill">${battery.temperature}&deg;C</span>`);
            }
            return pills.length ? `<div class="meta-pills">${pills.join('')}</div>` : `<div class="meta-pills"></div>`;
        }

        function deviceHTML(id, battery, storage, network) {
            const safeId = escapeHtml(id);
            return `
                <div class="device-top">
                    <div class="device-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
                    <div class="device-info">
                        <div class="device-name">${safeId}</div>
                        <div class="device-status"><span class="dot"></span>Connected</div>
                        ${metaPillsHTML(storage, network, battery)}
                    </div>
                    ${batteryHTML(battery)}
                    <button class="btn-revoke" data-id="${safeId}" title="Disconnect device">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="device-actions">
                    <div class="action-group">
                        <button class="btn-action act-send" data-id="${safeId}" title="Send files to phone">
                            <i class="fa-solid fa-paper-plane"></i><span>Send File</span>
                        </button>
                        <button class="btn-action act-photo" data-id="${safeId}" title="Pull latest camera photo to PC">
                            <i class="fa-solid fa-image"></i><span>Latest Photo</span>
                        </button>
                        <button class="btn-action act-shot" data-id="${safeId}" title="Pull latest screenshot to PC">
                            <i class="fa-solid fa-camera"></i><span>Screenshot</span>
                        </button>
                        <button class="btn-action act-clip" data-id="${safeId}" title="Send PC clipboard text to phone">
                            <i class="fa-solid fa-clipboard"></i><span>Paste to Phone</span>
                        </button>
                        <button class="btn-action act-ring" data-id="${safeId}" title="Ring and vibrate phone">
                            <i class="fa-solid fa-bell"></i><span>Ring</span>
                        </button>
                    </div>
                    <span class="drop-hint">Drop files here</span>
                </div>
            `;
        }

        function bindDeviceEvents(card, id) {
            card.querySelector('.btn-revoke').addEventListener('click', function () {
                revoke(id, this);
            });

            card.querySelector('.act-send').addEventListener('click', () => {
                currentUploadTarget = id;
                document.getElementById('hidden-file-input').click();
            });

            card.querySelector('.act-ring').addEventListener('click', function () {
                runQuickAction(id, 'ring', null, this);
            });

            card.querySelector('.act-photo').addEventListener('click', function () {
                runQuickAction(id, 'latest_photo', null, this);
            });

            card.querySelector('.act-shot').addEventListener('click', function () {
                runQuickAction(id, 'screenshot', null, this);
            });

            card.querySelector('.act-clip').addEventListener('click', async function () {
                try {
                    const text = await navigator.clipboard.readText();
                    if (!text) {
                        showToast('PC clipboard is empty');
                        return;
                    }
                    runQuickAction(id, 'clipboard_set', text, this);
                } catch (e) {
                    const manual = prompt('Enter text to send to phone clipboard:');
                    if (manual) runQuickAction(id, 'clipboard_set', manual, this);
                }
            });

            card.addEventListener('dragover', (e) => {
                e.preventDefault();
                card.classList.add('dragover');
            });

            card.addEventListener('dragleave', () => {
                card.classList.remove('dragover');
            });

            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    uploadFilesToDevice(id, e.dataTransfer.files);
                }
            });
        }

        document.getElementById('hidden-file-input').addEventListener('change', function () {
            if (this.files && this.files.length > 0 && currentUploadTarget) {
                uploadFilesToDevice(currentUploadTarget, this.files);
                this.value = '';
            }
        });

        async function uploadFilesToDevice(deviceId, fileList) {
            const formData = new FormData();
            for (const f of fileList) {
                formData.append('files', f);
            }
            showToast(`Sending ${fileList.length} file(s) to ${deviceId}...`);
            try {
                const res = await fetch(`/api/send_to_device/${encodeURIComponent(deviceId)}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    showToast(`Sent ${data.files.join(', ')} to /sdcard/JarvisShare`);
                } else {
                    showToast(`Transfer failed: ${data.detail || 'Error'}`);
                }
            } catch (err) {
                showToast(`Upload error: ${err.message}`);
            }
        }

        async function runQuickAction(deviceId, action, payload, btn) {
            if (btn) btn.disabled = true;
            try {
                const res = await fetch(`/api/action/${encodeURIComponent(deviceId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, payload })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.result || `Action '${action}' completed`);
                } else {
                    showToast(`Failed: ${data.detail || 'Action error'}`);
                }
            } catch (err) {
                showToast(`Error: ${err.message}`);
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        function addDevice(id, battery, storage, network) {
            if (devices.has(id)) {
                updateDeviceTelemetry(id, battery, storage);
                return;
            }
            devices.set(id, { battery: battery || null, storage: storage || null, network: network || null });

            const empty = document.getElementById('empty-msg');
            if (empty) empty.remove();

            const card = document.createElement('div');
            card.className = 'device';
            card.id = `dev-${cssId(id)}`;
            card.innerHTML = deviceHTML(id, battery, storage, network);
            bindDeviceEvents(card, id);
            document.getElementById('device-list').appendChild(card);
            updateStats();
        }

        function updateDeviceTelemetry(id, battery, storage) {
            const prev = devices.get(id) || {};
            const updated = {
                battery: battery !== undefined ? battery : prev.battery,
                storage: storage || prev.storage,
                network: prev.network
            };
            devices.set(id, updated);

            const el = document.getElementById(`dev-${cssId(id)}`);
            if (!el) return;
            const oldBat = el.querySelector('.battery');
            if (oldBat) {
                const tmp = document.createElement('div');
                tmp.innerHTML = batteryHTML(updated.battery);
                oldBat.replaceWith(tmp.firstElementChild);
            }
            const oldPills = el.querySelector('.meta-pills');
            if (oldPills) {
                const tmpP = document.createElement('div');
                tmpP.innerHTML = metaPillsHTML(updated.storage, updated.network, updated.battery);
                oldPills.replaceWith(tmpP.firstElementChild);
            }
            updateStats();
        }

        function removeDevice(id) {
            devices.delete(id);
            const el = document.getElementById(`dev-${cssId(id)}`);
            if (el) {
                el.classList.add('removing');
                setTimeout(() => {
                    el.remove();
                    if (devices.size === 0) {
                        document.getElementById('device-list').innerHTML =
                            '<div class="empty" id="empty-msg"><i class="fa-solid fa-inbox"></i><p>No devices paired yet</p></div>';
                    }
                    updateStats();
                }, 320);
            } else {
                updateStats();
            }
        }

        function cssId(id) {
            return String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function updateStats() {
            document.getElementById('dev-count').innerText = devices.size;
            document.getElementById('stat-devices').innerText = devices.size;

            let sum = 0, count = 0;
            devices.forEach(info => {
                const b = info ? info.battery : null;
                if (b && typeof b.level === 'number' && b.level >= 0) {
                    sum += b.level;
                    count++;
                }
            });
            document.getElementById('stat-battery').innerText =
                count > 0 ? Math.round(sum / count) + '%' : '--';
        }

        async function revoke(id, btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const res = await fetch(`/api/disconnect/${encodeURIComponent(id)}`, { method: 'POST' });
                if (!res.ok) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            }
        }

        function copyCmd(el) {
            const text = el.querySelector('.cmd-text').innerText.trim();
            const doIt = () => {
                const orig = el.querySelector('.cmd-text').innerText;
                el.classList.add('copied');
                el.querySelector('.cmd-text').innerText = '✓ Copied to clipboard';
                el.querySelector('i').className = 'fa-solid fa-check';
                setTimeout(() => {
                    el.classList.remove('copied');
                    el.querySelector('.cmd-text').innerText = orig;
                    el.querySelector('i').className = 'fa-regular fa-copy';
                }, 1500);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(doIt).catch(() => fallbackCopy(text, doIt));
            } else {
                fallbackCopy(text, doIt);
            }
        }

        function fallbackCopy(text, cb) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            cb();
        }

        const banner = document.getElementById('transfer-banner');
        const tTitle = document.getElementById('transfer-title');
        const tPct = document.getElementById('transfer-pct');
        const tFill = document.getElementById('transfer-fill');

        const wsUrl = `ws://${window.location.hostname}:${port}/ws/ui`;
        let socket;

        function connectWS() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                document.getElementById('stat-status').innerText = 'Online';
            };

            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'init') {
                    data.devices.forEach(d => addDevice(d.id, d.battery, d.storage, d.network));
                    updateStats();
                } else if (data.type === 'device_connected') {
                    addDevice(data.device_id, data.battery, data.storage, data.network);
                    showToast(`Connected: ${data.device_id}`);
                } else if (data.type === 'device_disconnected') {
                    removeDevice(data.device_id);
                    showToast(`Disconnected: ${data.device_id}`);
                } else if (data.type === 'battery_update') {
                    updateDeviceTelemetry(data.device_id, data.battery, data.storage);
                } else if (data.type === 'transfer_start') {
                    banner.classList.add('active');
                    tTitle.innerText = `${data.direction === 'pc_to_mobile' ? 'Sending' : 'Receiving'}: ${data.filename}`;
                    tPct.innerText = '0%';
                    tFill.style.width = '0%';
                } else if (data.type === 'transfer_progress') {
                    banner.classList.add('active');
                    tTitle.innerText = `${data.direction === 'pc_to_mobile' ? 'Sending' : 'Receiving'}: ${data.filename}`;
                    tPct.innerText = `${data.percent}%`;
                    tFill.style.width = `${data.percent}%`;
                } else if (data.type === 'transfer_complete') {
                    tPct.innerText = '100%';
                    tFill.style.width = '100%';
                    showToast(`Transfer complete: ${data.filename}`);
                    setTimeout(() => banner.classList.remove('active'), 1800);
                }
            };

            socket.onclose = () => {
                document.getElementById('stat-status').innerText = 'Reconnecting';
                setTimeout(connectWS, 2000);
            };

            socket.onerror = () => socket.close();
        }
        connectWS();
    </script>
</body>
</html>
