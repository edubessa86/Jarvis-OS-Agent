<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S · Mobile Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-0: #02040a;
            --bg-1: #060b18;
            --bg-2: #0b1224;
            --bg-3: #0f172e;
            --surface: rgba(15, 23, 42, 0.5);
            --surface-2: rgba(30, 41, 59, 0.55);
            --surface-3: rgba(15, 23, 42, 0.85);
            --border: rgba(148, 163, 184, 0.1);
            --border-2: rgba(148, 163, 184, 0.16);
            --border-hover: rgba(56, 189, 248, 0.5);
            --accent: #38bdf8;
            --accent-2: #22d3ee;
            --accent-3: #a855f7;
            --accent-4: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-bright: #f8fafc;
            --muted: #94a3b8;
            --muted-2: #64748b;
            --muted-3: #475569;
            --glow-blue: rgba(56, 189, 248, 0.5);
            --glow-purple: rgba(168, 85, 247, 0.5);
            --glow-green: rgba(16, 185, 129, 0.5);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --radius-2xl: 28px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-0);
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection { background: var(--accent); color: var(--bg-0); }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-grid {
            position: absolute;
            inset: -50%;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, #000 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, #000 20%, transparent 80%);
            animation: gridDrift 40s linear infinite;
        }

        @keyframes gridDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(56px, 56px); }
        }

        .bg-noise {
            position: absolute;
            inset: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            will-change: transform;
        }

        .orb-1 {
            width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.5), transparent 70%);
            top: -220px; left: -180px;
            animation: float1 22s ease-in-out infinite;
        }

        .orb-2 {
            width: 660px; height: 660px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4), transparent 70%);
            bottom: -260px; right: -200px;
            animation: float2 26s ease-in-out infinite;
        }

        .orb-3 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.28), transparent 70%);
            top: 40%; left: 45%;
            animation: float3 30s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(90px, 70px) scale(1.12); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-100px, -80px) scale(1.15); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(-70px, 50px) scale(1.08); }
            66%      { transform: translate(80px, -60px) scale(0.92); }
        }

        .shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1180px;
            background: linear-gradient(165deg, rgba(15, 23, 42, 0.72), rgba(2, 6, 23, 0.88));
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--border-2);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(56, 189, 248, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            padding: 36px;
            animation: shellIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .shell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.6), rgba(168, 85, 247, 0.6), transparent);
            opacity: 0.7;
        }

        @keyframes shellIn {
            from { opacity: 0; transform: translateY(32px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding-bottom: 26px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 24px;
            color: #e0f2fe;
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 50%, #a855f7 100%);
            box-shadow:
                0 0 40px rgba(56, 189, 248, 0.45),
                0 8px 24px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            animation: logoPulse 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 19px;
            background: conic-gradient(from 0deg, transparent, rgba(56, 189, 248, 0.6), transparent 30%);
            z-index: -1;
            animation: logoSpin 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes logoSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(56, 189, 248, 0.45), 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
            50%      { box-shadow: 0 0 60px rgba(168, 85, 247, 0.6), 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 7px;
            color: #f0f9ff;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
            line-height: 1;
        }

        .brand p {
            font-size: 10.5px;
            color: var(--muted);
            letter-spacing: 4px;
            margin-top: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .live-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.04));
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .live-pill.offline {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.04));
            border-color: rgba(239, 68, 68, 0.35);
            color: var(--danger);
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.15);
        }

        .live-pill .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8);
            animation: pulseLive 1.8s infinite;
            flex-shrink: 0;
        }

        .live-pill.offline .pulse {
            background: var(--danger);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8);
            animation: pulseOffline 1.8s infinite;
        }

        @keyframes pulseLive {
            0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
            70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes pulseOffline {
            0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 26px;
        }

        .stat {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            border-radius: var(--radius-lg);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.5), rgba(15, 23, 42, 0.7));
            border: 1px solid var(--border);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .stat::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .stat:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(56, 189, 248, 0.08);
        }

        .stat:hover::before { opacity: 1; }

        .stat i {
            font-size: 18px;
            color: var(--accent);
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(99, 102, 241, 0.08));
            border: 1px solid rgba(56, 189, 248, 0.22);
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .stat > div {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .stat span {
            font-size: 21px;
            font-weight: 800;
            color: var(--text-bright);
            letter-spacing: 0.4px;
            line-height: 1.1;
        }

        .stat small {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1.6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: 0.9fr 1.4fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
            .hero { flex-direction: column; align-items: flex-start; gap: 16px; }
            .shell { padding: 26px; border-radius: 22px; }
            body { padding: 24px 16px; }
        }

        @media (max-width: 500px) {
            .shell { padding: 20px; border-radius: 20px; }
            .brand h1 { font-size: 20px; letter-spacing: 5px; }
            .logo { width: 48px; height: 48px; font-size: 20px; border-radius: 13px; }
            .stat span { font-size: 18px; }
        }

        .card {
            position: relative;
            border-radius: var(--radius-xl);
            padding: 24px;
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.42), rgba(2, 6, 23, 0.72));
            border: 1px solid var(--border);
            overflow: hidden;
            transition: border-color 0.35s, box-shadow 0.35s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: rgba(148, 163, 184, 0.22);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), rgba(168, 85, 247, 0.5), transparent);
            opacity: 0.35;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 2.6px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .card-head i {
            color: var(--accent);
            font-size: 13px;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
        }

        .card-head .badge {
            margin-left: auto;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(99, 102, 241, 0.1));
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            min-width: 30px;
            text-align: center;
        }

        .qr-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            flex: 1;
            justify-content: center;
        }

        .qr-frame {
            position: relative;
            padding: 14px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow:
                0 0 50px rgba(56, 189, 248, 0.3),
                0 20px 40px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(56, 189, 248, 0.15);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s;
            overflow: hidden;
        }

        .qr-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(168, 85, 247, 0.8), rgba(56, 189, 248, 0.8));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.7;
            pointer-events: none;
        }

        .qr-frame:hover {
            transform: translateY(-5px) scale(1.025);
            box-shadow:
                0 0 70px rgba(56, 189, 248, 0.55),
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(56, 189, 248, 0.25);
        }

        .qr-frame img {
            display: block;
            width: 190px;
            height: 190px;
            border-radius: 8px;
        }

        .scanline {
            position: absolute;
            left: 8px; right: 8px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #a855f7, #38bdf8, transparent);
            box-shadow: 0 0 24px rgba(56, 189, 248, 1), 0 0 40px rgba(168, 85, 247, 0.6);
            animation: scan 3.2s ease-in-out infinite;
            pointer-events: none;
            border-radius: 3px;
        }

        @keyframes scan {
            0%   { top: 8%; opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: 92%; opacity: 0; }
        }

        .cmd {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(145deg, #020617, #0a0f1f);
            border: 1px solid var(--border-2);
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .cmd::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(56, 189, 248, 0.06), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cmd i {
            color: var(--accent);
            font-size: 13px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .cmd .cmd-text {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 11.5px;
            color: #4ade80;
            word-break: break-all;
            transition: color 0.25s;
            text-align: left;
            flex: 1;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .cmd:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 26px rgba(16, 185, 129, 0.2);
            transform: translateY(-1px);
        }

        .cmd:hover::before { opacity: 1; }
        .cmd:hover i { transform: scale(1.1); }

        .cmd.copied {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
        }

        .cmd.copied .cmd-text { color: var(--accent); }

        .tip {
            font-size: 10.5px;
            color: var(--muted-2);
            text-align: center;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            line-height: 1.5;
            padding: 0 8px;
            font-weight: 500;
        }

        .tip i { color: var(--warning); font-size: 11px; flex-shrink: 0; }

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 6px;
            margin-right: -6px;
        }

        .device-list::-webkit-scrollbar { width: 6px; }
        .device-list::-webkit-scrollbar-track { background: transparent; }
        .device-list::-webkit-scrollbar-thumb {
            background: var(--border-2);
            border-radius: 3px;
            transition: background 0.2s;
        }
        .device-list::-webkit-scrollbar-thumb:hover { background: var(--muted-3); }

        .empty {
            text-align: center;
            padding: 56px 24px;
            color: var(--muted);
            border: 1px dashed var(--border-2);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: rgba(15, 23, 42, 0.3);
        }

        .empty i {
            font-size: 34px;
            color: var(--muted-3);
            animation: softFloat 3.2s ease-in-out infinite;
        }

        @keyframes softFloat {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50%      { transform: translateY(-8px); opacity: 1; }
        }

        .empty p {
            font-size: 12.5px;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .device {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px 18px;
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.55), rgba(15, 23, 42, 0.85));
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .device::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--success), var(--accent), var(--accent-3));
            opacity: 0;
            transition: opacity 0.35s;
        }

        .device::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .device:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateX(4px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(56, 189, 248, 0.1);
        }

        .device:hover::before,
        .device:hover::after { opacity: 1; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-32px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .device.removing {
            animation: slideOut 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(80px) scale(0.9); }
        }

        .device-top {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .device.dragover {
            border-color: var(--accent);
            box-shadow: 0 0 36px rgba(56, 189, 248, 0.45), inset 0 0 0 1px rgba(56, 189, 248, 0.2);
            background: linear-gradient(145deg, rgba(14, 165, 233, 0.15), rgba(15, 23, 42, 0.9));
        }

        .device-icon {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 17px;
            color: #e0f2fe;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(168, 85, 247, 0.22));
            border: 1px solid rgba(56, 189, 248, 0.28);
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
            flex: 1;
        }

        .device-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .device-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: dotPulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(0.85); }
        }

        .battery {
            position: relative;
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .battery svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .battery .ring-bg {
            fill: none;
            stroke: rgba(148, 163, 184, 0.12);
            stroke-width: 3.5;
        }

        .battery .ring-fill {
            fill: none;
            stroke: var(--success);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 113.1;
            stroke-dashoffset: 113.1;
            transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s;
            filter: drop-shadow(0 0 4px currentColor);
        }

        .battery.low .ring-fill { stroke: var(--danger); }
        .battery.mid .ring-fill { stroke: var(--warning); }
        .battery.high .ring-fill { stroke: var(--success); }

        .battery-label {
            position: relative;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--text-bright);
            letter-spacing: 0.2px;
            display: flex;
            align-items: baseline;
            gap: 1px;
        }

        .battery-label span {
            font-size: 8px;
            color: var(--muted);
            font-weight: 700;
        }

        .battery-bolt {
            position: absolute;
            top: -2px;
            right: -4px;
            font-size: 9px;
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(251, 191, 36, 1);
            animation: boltFlash 1.6s ease-in-out infinite;
            display: none;
        }

        .battery.charging .battery-bolt { display: block; }

        @keyframes boltFlash {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(0.85); }
        }

        .battery.unavailable .ring-fill { stroke: var(--muted-2); stroke-dashoffset: 113.1; }
        .battery.unavailable .battery-label { color: var(--muted); font-size: 10px; }

        .btn-revoke {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.06);
            color: var(--danger);
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 13px;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .btn-revoke:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.6);
            transform: scale(1.1) rotate(90deg);
        }

        .btn-revoke:disabled {
            opacity: 0.4;
            cursor: wait;
            transform: none;
        }

        .meta-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            padding: 3px 9px;
            border-radius: 7px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.25s;
        }

        .meta-pill i {
            font-size: 9px;
            color: var(--accent);
            opacity: 0.8;
        }

        .meta-pill:hover {
            border-color: rgba(56, 189, 248, 0.3);
            color: var(--text);
        }

        .device-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.08);
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.7);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.06));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn-action i {
            color: var(--accent);
            font-size: 11px;
            position: relative;
            transition: transform 0.25s;
        }

        .btn-action span { position: relative; }

        .btn-action:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
        }

        .btn-action:hover::before { opacity: 1; }
        .btn-action:hover i { transform: scale(1.15); }

        .btn-action:disabled {
            opacity: 0.45;
            cursor: wait;
            transform: none;
        }

        .drop-hint {
            font-size: 10px;
            color: var(--muted-2);
            letter-spacing: 0.4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .transfer-banner {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: var(--radius);
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.35);
            display: none;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
            animation: bannerIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes bannerIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .transfer-banner.active { display: flex; }

        .transfer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text);
        }

        .transfer-head span:first-child {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transfer-head span:first-child::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: dotPulse 1.4s infinite;
            flex-shrink: 0;
        }

        .transfer-head span:last-child {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            flex-shrink: 0;
        }

        .transfer-bar-bg {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            overflow: hidden;
            position: relative;
        }

        .transfer-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--success));
            transition: width 0.25s ease;
            position: relative;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .transfer-bar-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: barShimmer 1.6s ease-in-out infinite;
        }

        @keyframes barShimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .toast-msg {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            padding: 14px 20px;
            border-radius: var(--radius);
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.98));
            border: 1px solid var(--border-hover);
            color: var(--text-bright);
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(20px);
        }

        .toast-msg::before {
            content: '';
            width: 3px;
            height: 20px;
            border-radius: 2px;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            flex-shrink: 0;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .toast-msg.error {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(239, 68, 68, 0.2);
        }

        .toast-msg.error::before {
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger);
        }

        .toast-msg.success {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .toast-msg.success::before {
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
        }

        @media (max-width: 500px) {
            .toast-msg {
                left: 16px;
                right: 16px;
                bottom: 16px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="bg-grid"></div>
        <div class="bg-noise"></div>
    </div>

    <main class="shell">
        <header class="hero">
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-circle-nodes"></i></div>
                <div>
                    <h1>J.A.R.V.I.S</h1>
                    <p>Mobile Command Bridge</p>
                </div>
            </div>
            <div class="live-pill" id="live-pill">
                <span class="pulse"></span>
                <span id="bridge-pill-text">Listening</span>
            </div>
        </header>

        <section class="stats">
            <div class="stat">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <div>
                    <span id="stat-devices">0</span>
                    <small>Paired Devices</small>
                </div>
            </div>
            <div class="stat">
                <i class="fa-solid fa-battery-three-quarters"></i>
                <div>
                    <span id="stat-battery">--</span>
                    <small>Avg Battery</small>
                </div>
            </div>
            <div class="stat">
                <i class="fa-solid fa-network-wired"></i>
                <div>
                    <span id="stat-status">Online</span>
                    <small>Bridge Status</small>
                </div>
            </div>
        </section>

        <section class="grid">
            <article class="card qr-card">
                <div class="card-head">
                    <i class="fa-solid fa-qrcode"></i>
                    <span>Scan to Pair</span>
                </div>
                <div class="qr-body">
                    <div class="qr-frame">
                        <img id="qr-img" src="/api/qr" alt="QR Code">
                        <div class="scanline"></div>
                    </div>
                    <div class="cmd" id="cmd-box" onclick="copyCmd(this)">
                        <i class="fa-regular fa-copy"></i>
                        <span class="cmd-text">curl -s http://{{ip_address}}:{{port}}/api/setup | python</span>
                    </div>
                    <p class="tip">
                        <i class="fa-solid fa-lightbulb"></i>
                        Termux &middot; Share any file on Android &rarr; Termux to send to PC
                    </p>
                </div>
            </article>

            <article class="card devices-card">
                <div class="card-head">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <span>Connected Devices</span>
                    <span class="badge" id="dev-count">0</span>
                </div>
                <div class="device-list" id="device-list">
                    <div class="empty" id="empty-msg">
                        <i class="fa-solid fa-inbox"></i>
                        <p>No devices paired yet</p>
                    </div>
                </div>
                <div class="transfer-banner" id="transfer-banner">
                    <div class="transfer-head">
                        <span id="transfer-title">Transferring file...</span>
                        <span id="transfer-pct">0%</span>
                    </div>
                    <div class="transfer-bar-bg">
                        <div class="transfer-bar-fill" id="transfer-fill"></div>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <input type="file" id="hidden-file-input" multiple style="display:none">
    <div class="toast-msg" id="toast-msg"></div>

    <script>
        const port = "{{port}}";
        const devices = new Map();
        const CIRC = 113.1;
        let currentUploadTarget = null;
        let bannerTimer = null;

        function showToast(text, type) {
            const t = document.getElementById('toast-msg');
            t.innerText = text;
            t.className = 'toast-msg show' + (type ? ' ' + type : '');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => { t.className = 'toast-msg'; }, 400);
            }, 3200);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function batteryClass(level) {
            if (level == null || level < 0) return 'unavailable';
            if (level < 20) return 'low';
            if (level < 60) return 'mid';
            return 'high';
        }

        function batteryHTML(b) {
            const hasLevel = b && typeof b.level === 'number' && b.level >= 0;
            const level = hasLevel ? b.level : null;
            const charging = b && b.charging;
            const cls = batteryClass(level);
            const offset = hasLevel ? (CIRC * (1 - level / 100)) : CIRC;
            const label = hasLevel ? `${level}<span>%</span>` : 'N/A';
            return `
                <div class="battery ${cls} ${charging ? 'charging' : ''}">
                    <svg viewBox="0 0 44 44">
                        <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
                        <circle class="ring-fill" cx="22" cy="22" r="18" style="stroke-dashoffset:${offset}"></circle>
                    </svg>
                    <div class="battery-label">${label}</div>
                    <i class="fa-solid fa-bolt battery-bolt"></i>
                </div>
            `;
        }

        function metaPillsHTML(storage, network, battery) {
            const pills = [];
            if (storage && storage.free_gb != null) {
                pills.push(`<span class="meta-pill"><i class="fa-solid fa-hard-drive"></i>${storage.free_gb} GB free</span>`);
            }
            if (network && network.ip) {
                pills.push(`<span class="meta-pill"><i class="fa-solid fa-wifi"></i>${escapeHtml(network.ip)}</span>`);
            }
            if (battery && battery.temperature != null) {
                pills.push(`<span class="meta-pill"><i class="fa-solid fa-temperature-half"></i>${battery.temperature}&deg;C</span>`);
            }
            return `<div class="meta-pills">${pills.join('')}</div>`;
        }

        function deviceHTML(id, battery, storage, network) {
            const safeId = escapeHtml(id);
            return `
                <div class="device-top">
                    <div class="device-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
                    <div class="device-info">
                        <div class="device-name">${safeId}</div>
                        <div class="device-status"><span class="dot"></span>Connected</div>
                        ${metaPillsHTML(storage, network, battery)}
                    </div>
                    ${batteryHTML(battery)}
                    <button class="btn-revoke" data-id="${safeId}" title="Disconnect device">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="device-actions">
                    <div class="action-group">
                        <button class="btn-action act-send" data-id="${safeId}" title="Send files to phone">
                            <i class="fa-solid fa-paper-plane"></i><span>Send</span>
                        </button>
                        <button class="btn-action act-photo" data-id="${safeId}" title="Pull latest camera photo to PC">
                            <i class="fa-solid fa-image"></i><span>Photo</span>
                        </button>
                        <button class="btn-action act-shot" data-id="${safeId}" title="Pull latest screenshot to PC">
                            <i class="fa-solid fa-camera"></i><span>Screen</span>
                        </button>
                        <button class="btn-action act-clip" data-id="${safeId}" title="Send PC clipboard text to phone">
                            <i class="fa-solid fa-clipboard"></i><span>Paste</span>
                        </button>
                        <button class="btn-action act-clip-get" data-id="${safeId}" title="Copy phone clipboard to PC">
                            <i class="fa-solid fa-clipboard-check"></i><span>Copy</span>
                        </button>
                        <button class="btn-action act-ring" data-id="${safeId}" title="Ring and vibrate phone">
                            <i class="fa-solid fa-bell"></i><span>Ring</span>
                        </button>
                    </div>
                    <span class="drop-hint">Drop files here</span>
                </div>
            `;
        }

        function bindDeviceEvents(card, id) {
            card.querySelector('.btn-revoke').addEventListener('click', function () {
                revoke(id, this);
            });

            card.querySelector('.act-send').addEventListener('click', () => {
                currentUploadTarget = id;
                document.getElementById('hidden-file-input').click();
            });

            card.querySelector('.act-ring').addEventListener('click', function () {
                runQuickAction(id, 'ring', null, this);
            });

            card.querySelector('.act-photo').addEventListener('click', function () {
                runQuickAction(id, 'latest_photo', null, this);
            });

            card.querySelector('.act-shot').addEventListener('click', function () {
                runQuickAction(id, 'screenshot', null, this);
            });

            card.querySelector('.act-clip').addEventListener('click', async function () {
                let text = null;
                if (navigator.clipboard && window.isSecureContext) {
                    try {
                        text = await navigator.clipboard.readText();
                    } catch (e) {
                        text = null;
                    }
                }
                runQuickAction(id, 'clipboard_set', text || null, this);
            });

            card.querySelector('.act-clip-get').addEventListener('click', function () {
                runQuickAction(id, 'clipboard_get', null, this);
            });

            card.addEventListener('dragover', (e) => {
                e.preventDefault();
                card.classList.add('dragover');
            });

            card.addEventListener('dragleave', () => {
                card.classList.remove('dragover');
            });

            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    uploadFilesToDevice(id, e.dataTransfer.files);
                }
            });
        }

        document.getElementById('hidden-file-input').addEventListener('change', function () {
            if (this.files && this.files.length > 0 && currentUploadTarget) {
                uploadFilesToDevice(currentUploadTarget, this.files);
                this.value = '';
            }
        });

        async function uploadFilesToDevice(deviceId, fileList) {
            const formData = new FormData();
            for (const f of fileList) {
                formData.append('files', f);
            }
            showToast(`Sending ${fileList.length} file(s) to ${deviceId}...`);
            try {
                const res = await fetch(`/api/send_to_device/${encodeURIComponent(deviceId)}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    showToast(`Sent to /sdcard/JarvisShare`, 'success');
                } else {
                    showToast(`Transfer failed: ${data.detail || 'Error'}`, 'error');
                }
            } catch (err) {
                showToast(`Upload error: ${err.message}`, 'error');
            }
        }

        async function runQuickAction(deviceId, action, payload, btn) {
            if (btn) btn.disabled = true;
            try {
                const res = await fetch(`/api/action/${encodeURIComponent(deviceId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, payload })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.result || `Action completed`, 'success');
                } else {
                    showToast(`Failed: ${data.detail || 'Action error'}`, 'error');
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, 'error');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        function addDevice(id, battery, storage, network) {
            if (devices.has(id)) {
                updateDeviceTelemetry(id, battery, storage, network);
                return;
            }
            devices.set(id, {
                battery: battery || null,
                storage: storage || null,
                network: network || null
            });

            const empty = document.getElementById('empty-msg');
            if (empty) empty.remove();

            const card = document.createElement('div');
            card.className = 'device';
            card.id = `dev-${cssId(id)}`;
            card.innerHTML = deviceHTML(id, battery, storage, network);
            bindDeviceEvents(card, id);
            document.getElementById('device-list').appendChild(card);
            updateStats();
        }

        function updateDeviceTelemetry(id, battery, storage, network) {
            const prev = devices.get(id) || {};
            const updated = {
                battery: battery !== undefined && battery !== null ? battery : prev.battery,
                storage: storage || prev.storage,
                network: network || prev.network
            };
            devices.set(id, updated);

            const el = document.getElementById(`dev-${cssId(id)}`);
            if (!el) return;

            const oldBat = el.querySelector('.battery');
            if (oldBat) {
                const tmp = document.createElement('div');
                tmp.innerHTML = batteryHTML(updated.battery);
                oldBat.replaceWith(tmp.firstElementChild);
            }

            const oldPills = el.querySelector('.meta-pills');
            if (oldPills) {
                const tmpP = document.createElement('div');
                tmpP.innerHTML = metaPillsHTML(updated.storage, updated.network, updated.battery);
                oldPills.replaceWith(tmpP.firstElementChild);
            }
            updateStats();
        }

        function removeDevice(id) {
            devices.delete(id);
            const el = document.getElementById(`dev-${cssId(id)}`);
            if (el) {
                el.classList.add('removing');
                setTimeout(() => {
                    el.remove();
                    if (devices.size === 0) {
                        document.getElementById('device-list').innerHTML =
                            '<div class="empty" id="empty-msg"><i class="fa-solid fa-inbox"></i><p>No devices paired yet</p></div>';
                    }
                    updateStats();
                }, 350);
            } else {
                updateStats();
            }
        }

        function cssId(id) {
            return String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function updateStats() {
            document.getElementById('dev-count').innerText = devices.size;
            document.getElementById('stat-devices').innerText = devices.size;

            let sum = 0, count = 0;
            devices.forEach(info => {
                const b = info ? info.battery : null;
                if (b && typeof b.level === 'number' && b.level >= 0) {
                    sum += b.level;
                    count++;
                }
            });
            document.getElementById('stat-battery').innerText =
                count > 0 ? Math.round(sum / count) + '%' : '--';
        }

        async function revoke(id, btn) {
            btn.disabled = true;
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const res = await fetch(`/api/disconnect/${encodeURIComponent(id)}`, { method: 'POST' });
                if (res.ok) {
                    removeDevice(id);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    showToast('Failed to disconnect device', 'error');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = orig;
                showToast(`Disconnect error: ${err.message}`, 'error');
            }
        }

        function copyCmd(el) {
            const text = el.querySelector('.cmd-text').innerText.trim();
            const doIt = () => {
                const cmdText = el.querySelector('.cmd-text');
                const icon = el.querySelector('i');
                const orig = cmdText.innerText;
                const origIcon = icon.className;
                el.classList.add('copied');
                cmdText.innerText = '✓ Copied to clipboard';
                icon.className = 'fa-solid fa-check';
                setTimeout(() => {
                    el.classList.remove('copied');
                    cmdText.innerText = orig;
                    icon.className = origIcon;
                }, 1500);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(doIt).catch(() => fallbackCopy(text, doIt));
            } else {
                fallbackCopy(text, doIt);
            }
        }

        function fallbackCopy(text, cb) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            cb();
        }

        const banner = document.getElementById('transfer-banner');
        const tTitle = document.getElementById('transfer-title');
        const tPct = document.getElementById('transfer-pct');
        const tFill = document.getElementById('transfer-fill');
        const livePill = document.getElementById('live-pill');
        const pillText = document.getElementById('bridge-pill-text');

        function setBridgeStatus(online) {
            if (online) {
                livePill.classList.remove('offline');
                pillText.innerText = 'Listening';
                document.getElementById('stat-status').innerText = 'Online';
            } else {
                livePill.classList.add('offline');
                pillText.innerText = 'Reconnecting';
                document.getElementById('stat-status').innerText = 'Reconnecting';
            }
        }

        function showTransferBanner(direction, filename, percent) {
            clearTimeout(bannerTimer);
            banner.classList.add('active');
            const verb = direction === 'pc_to_mobile' ? 'Sending' : 'Receiving';
            tTitle.innerText = `${verb}: ${filename}`;
            tPct.innerText = `${percent}%`;
            tFill.style.width = `${percent}%`;
        }

        function hideTransferBanner(delay) {
            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => banner.classList.remove('active'), delay);
        }

        const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProto}//${window.location.hostname}:${port}/ws/ui`;
        let socket;
        let reconnectTimer = null;

        function connectWS() {
            clearTimeout(reconnectTimer);
            try {
                socket = new WebSocket(wsUrl);
            } catch (err) {
                setBridgeStatus(false);
                reconnectTimer = setTimeout(connectWS, 2500);
                return;
            }

            socket.onopen = () => {
                setBridgeStatus(true);
            };

            socket.onmessage = (e) => {
                let data;
                try {
                    data = JSON.parse(e.data);
                } catch (err) {
                    return;
                }

                if (data.type === 'init') {
                    document.getElementById('device-list').innerHTML = '';
                    devices.clear();
                    if (!data.devices || data.devices.length === 0) {
                        document.getElementById('device-list').innerHTML =
                            '<div class="empty" id="empty-msg"><i class="fa-solid fa-inbox"></i><p>No devices paired yet</p></div>';
                    } else {
                        data.devices.forEach(d => addDevice(d.id, d.battery, d.storage, d.network));
                    }
                    updateStats();
                } else if (data.type === 'device_connected') {
                    addDevice(data.device_id, data.battery, data.storage, data.network);
                    showToast(`Connected: ${data.device_id}`, 'success');
                } else if (data.type === 'device_disconnected') {
                    removeDevice(data.device_id);
                    showToast(`Disconnected: ${data.device_id}`);
                } else if (data.type === 'battery_update') {
                    updateDeviceTelemetry(data.device_id, data.battery, data.storage, data.network);
                } else if (data.type === 'transfer_start') {
                    showTransferBanner(data.direction, data.filename, 0);
                } else if (data.type === 'transfer_progress') {
                    showTransferBanner(data.direction, data.filename, data.percent);
                } else if (data.type === 'transfer_complete') {
                    showTransferBanner(data.direction, data.filename, 100);
                    showToast(`Transfer complete: ${data.filename}`, 'success');
                    hideTransferBanner(1800);
                } else if (data.type === 'transfer_error') {
                    hideTransferBanner(200);
                    showToast(`Transfer failed (${data.filename}): ${data.error || 'Interrupted'}`, 'error');
                } else if (data.type === 'command_start') {
                    showToast(`Running command on ${data.device_id}...`);
                } else if (data.type === 'command_complete') {
                    if (data.returncode === 0) {
                        showToast(`Command finished on ${data.device_id}`, 'success');
                    } else {
                        showToast(`Command failed on ${data.device_id} (exit ${data.returncode})`, 'error');
                    }
                }
            };

            socket.onclose = () => {
                setBridgeStatus(false);
                reconnectTimer = setTimeout(connectWS, 2500);
            };

            socket.onerror = () => {
                try { socket.close(); } catch (e) {}
            };
        }
        connectWS();
    </script>
</body>
</html>
